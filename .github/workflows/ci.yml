name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'public/images/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npx astro check
      - run: npm run build
